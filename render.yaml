services:
  - type: web
    name: kalaivanimart
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /kalaivanimart/health
    envVars:
      - key: DB_TYPE
        value: mysql
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: PORT
        value: 8080
